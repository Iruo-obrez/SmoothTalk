<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SmoothTalk</title>
    <!-- Load Tailwind CSS for modern layout utilities -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Exact Apple iOS Dark Mode iMessage Color Palette */
        :root {
            --imessage-bg: #000000;
            --imessage-card: rgba(22, 22, 24, 0.85);
            --imessage-blue: #007AFF;
            --imessage-green: #34C759;
            --imessage-grey-bubble: #26262A;
            --imessage-input-bg: #1C1C1E;
            --imessage-text: #FFFFFF;
            --imessage-subtext: #8E8E93;
            --imessage-border: rgba(255, 255, 255, 0.12);
        }

        /* Custom font and base reset */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--imessage-bg);
            color: var(--imessage-text);
            margin: 0;
            padding: 0;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* Full screen dynamic viewport wrapper */
        .app-wrapper {
            height: 100dvh;
            max-width: 42rem; /* Compact iMessage frame width on desktop */
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            background-color: var(--imessage-card);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            position: relative;
        }

        @media (min-width: 640px) {
            .app-wrapper {
                height: 92vh;
                margin-top: 4vh;
                border-radius: 32px;
                border: 1px solid var(--imessage-border);
                box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
            }
        }

        /* Chat history container scroll area */
        #chat-container {
            flex-grow: 1;
            overflow-y: auto;
            scroll-behavior: smooth;
            background-color: transparent;
            -webkit-overflow-scrolling: touch;
        }
        
        #chat-container::-webkit-scrollbar {
            width: 4px;
        }
        #chat-container::-webkit-scrollbar-thumb {
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        /* Authentic iMessage User Bubble (Blue) */
        .user-message {
            background-color: var(--imessage-blue); 
            color: #FFFFFF; 
            font-weight: 400;
            font-size: 0.95rem;
            line-height: 1.35;
            border-radius: 18px 18px 4px 18px;
            max-width: 82%;
            align-self: flex-end;
            padding: 9px 15px;
            word-break: break-word;
        }

        /* Authentic iMessage Received Bubble (Grey) */
        .ai-message {
            background-color: var(--imessage-grey-bubble); 
            color: #FFFFFF;
            font-weight: 400;
            font-size: 0.95rem;
            line-height: 1.35;
            border-radius: 18px 18px 18px 4px;
            max-width: 82%;
            align-self: flex-start;
            padding: 9px 15px;
            word-break: break-word;
        }

        /* Typing indicator dots */
        .dot {
            height: 7px;
            width: 7px;
            background-color: #8E8E93; 
            border-radius: 50%;
            display: inline-block;
            margin: 0 1px;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        .dot:nth-child(3) { animation-delay: 0s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="app-wrapper">
        
        <!-- Clean iOS Header -->
        <header class="py-3 px-4 bg-[#121214]/90 text-white border-b border-[var(--imessage-border)] flex flex-col items-center justify-center shrink-0 relative">
            <div class="relative mb-1">
                <div class="w-10 h-10 rounded-full bg-gradient-to-b from-[#8E8E93] to-[#636366] flex items-center justify-center font-semibold text-white text-base shadow-sm">
                    ST
                </div>
                <span class="absolute bottom-0 right-0 w-3 h-3 bg-[var(--imessage-green)] border-2 border-[#121214] rounded-full"></span>
            </div>
            <h1 class="text-sm font-semibold tracking-tight text-white flex items-center gap-1">
                SmoothTalk
            </h1>
        </header>

        <!-- Chat History Container -->
        <main id="chat-container" class="flex flex-col p-4 space-y-3">
            <!-- SmoothTalk Assistant Pill -->
            <div class="text-center my-1">
                <span class="text-[11px] font-medium tracking-wide text-[var(--imessage-subtext)] bg-[#1C1C1E]/80 px-3 py-1 rounded-full border border-white/5">
                    SMOOTHTALK ASSISTANT
                </span>
            </div>

            <!-- Initial Welcome Message -->
            <div class="flex flex-col space-y-1">
                <div class="ai-message">
                    Welcome to the SmoothTalk lab. Select an option below to craft a line:
                    <ul class="mt-2 space-y-1 text-xs text-gray-300 list-disc list-inside">
                        <li><strong class="text-[var(--imessage-blue)]">Compliment:</strong> Enter a trait (e.g., 'nice eyes').</li>
                        <li><strong class="text-[var(--imessage-blue)]">Follow-Up:</strong> Enter their last message (e.g., 'How are you').</li>
                    </ul>
                </div>
                <span class="text-[10px] text-[var(--imessage-subtext)] ml-1">Delivered</span>
            </div>
        </main>

        <!-- Input Area / iMessage Footer -->
        <div class="p-3 bg-[#121214]/95 border-t border-[var(--imessage-border)] shrink-0 pb-safe">
            <div class="flex flex-col gap-2.5 max-w-2xl mx-auto">
                <div class="relative flex items-center">
                    <input 
                        type="text" 
                        id="user-input" 
                        placeholder="SmoothTalk..."
                        class="w-full px-4 py-2.5 text-sm bg-[var(--imessage-input-bg)] text-white placeholder-[var(--imessage-subtext)] rounded-full border border-white/10 focus:outline-none focus:border-[var(--imessage-blue)]"
                        autofocus
                    >
                </div>
                <div class="flex gap-2">
                    <button 
                        onclick="handleGeneration('compliment')" 
                        id="compliment-button"
                        class="flex-1 bg-[var(--imessage-blue)] text-white font-medium text-xs sm:text-sm py-2.5 px-3 rounded-full hover:opacity-90 active:scale-[0.98] transition duration-150 shadow-sm flex items-center justify-center gap-1 disabled:opacity-40"
                    >
                        💎 Get Compliment
                    </button>
                    <button 
                        onclick="handleGeneration('followup')" 
                        id="followup-button"
                        class="flex-1 bg-[#2C2C2E] text-white font-medium text-xs sm:text-sm py-2.5 px-3 rounded-full hover:bg-[#3A3A3C] active:scale-[0.98] transition duration-150 border border-white/10 shadow-sm flex items-center justify-center gap-1 disabled:opacity-40"
                    >
                        ✨ Get Follow-Up
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const apiKey = "AIzaSyB2q_1IUf4NLRaImh5rhQbuzFDMus4HBHA"; // Leave as-is for Canvas environment
        const modelName = "gemini-2.5-flash-preview-05-20";
        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`;

        // System prompt for the Compliment Architect mode
        const complimentSystemPrompt = "You are 'The Compliment Architect,' a master of smooth, clever, and genuinely flattering pickup lines and compliments. The user will provide a specific feature, trait, hobby, or keyword (e.g., 'blue eyes', 'reading', 'band t-shirt'). Your sole task is to generate ONE single, original, and highly effective pickup line or compliment based ONLY on that input. Keep the response concise, punchy, and less than 30 words. Do not provide extra commentary or advice, just the line itself.";

        // System prompt for the Follow-Up Generator mode
        const followupSystemPrompt = "You are 'The Follow-Up Generator,' a witty and charismatic conversation expert. The user will provide the last message they received from someone (e.g., 'I love dogs' or 'What do you do for fun?'). Your task is to generate ONE single, natural, and engaging response that continues the conversation smoothly, usually by asking an open-ended question or making a confident, light-hearted statement. Keep the response concise and engaging (under 30 words). Do not provide extra commentary or advice, just the line itself.";

        // DOM Elements
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const complimentButton = document.getElementById('compliment-button');
        const followupButton = document.getElementById('followup-button');
        let isGenerating = false;

        /**
         * Scrolls the chat container to the bottom.
         */
        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        /**
         * Adds a message bubble to the chat container.
         * @param {string} text - The message content.
         * @param {string} sender - 'user' or 'ai'.
         * @param {string} [id] - Optional ID for the message element.
         */
        function addMessage(text, sender, id = null) {
            const messageWrapper = document.createElement('div');
            messageWrapper.className = `flex flex-col space-y-0.5 ${sender === 'user' ? 'items-end' : 'items-start'}`;
            if (id) messageWrapper.id = id;
            
            const bubble = document.createElement('div');
            bubble.className = `${sender}-message`;
            bubble.innerHTML = text;
            
            messageWrapper.appendChild(bubble);

            // iOS status label below bubbles
            const statusText = document.createElement('span');
            statusText.className = "text-[10px] text-[var(--imessage-subtext)] px-1";
            statusText.innerText = sender === 'user' ? 'Delivered' : 'Just now';
            messageWrapper.appendChild(statusText);

            chatContainer.appendChild(messageWrapper);
            scrollToBottom();
            return messageWrapper;
        }

        /**
         * Shows the AI typing indicator.
         */
        function showLoading() {
            const loadingHtml = `
                <div class="flex items-center space-x-1 py-1 px-1">
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
            `;
            return addMessage(loadingHtml, 'ai', 'loading-indicator');
        }

        /**
         * Main function to handle generation based on the selected mode.
         */
        async function handleGeneration(mode) {
            if (isGenerating) return;

            const query = userInput.value.trim();
            if (query === "") return;

            const currentSystemPrompt = mode === 'compliment' ? complimentSystemPrompt : followupSystemPrompt;
            const buttonText = mode === 'compliment' ? 'Compliment' : 'Follow-Up';

            // 1. Display user message and clear input
            addMessage(`<span class="opacity-75 text-[11px] block mb-0.5">[${buttonText}]:</span> ${query}`, 'user');
            userInput.value = '';
            
            // 2. Show loading indicator and disable buttons
            const loadingIndicator = showLoading();
            isGenerating = true;
            complimentButton.disabled = true;
            followupButton.disabled = true;

            try {
                // 3. Call the Gemini API
                const responseText = await generateRizz(query, currentSystemPrompt);

                // 4. Replace loading indicator inner content with AI response
                const bubbleEl = loadingIndicator.querySelector('.ai-message');
                if (bubbleEl) {
                    bubbleEl.innerHTML = responseText;
                }
            } catch (error) {
                console.error("Gemini API Error:", error);
                const bubbleEl = loadingIndicator.querySelector('.ai-message');
                if (bubbleEl) {
                    bubbleEl.innerHTML = `<span class="text-red-400 font-semibold">Error:</span> Could not connect. Try again.`;
                }
            } finally {
                // 5. Cleanup
                isGenerating = false;
                complimentButton.disabled = false;
                followupButton.disabled = false;
                scrollToBottom();
            }
        }

        /**
         * Generates the response from the Gemini API with exponential backoff.
         */
        async function generateRizz(userQuery, systemPrompt) {
            const payload = {
                contents: [{ parts: [{ text: userQuery }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] },
            };

            const MAX_RETRIES = 3;
            for (let i = 0; i < MAX_RETRIES; i++) {
                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        if (i < MAX_RETRIES - 1) {
                            const delay = Math.pow(2, i) * 1000;
                            await new Promise(resolve => setTimeout(resolve, delay));
                            continue;
                        } else {
                            throw new Error(`API call failed with status: ${response.status}`);
                        }
                    }

                    const result = await response.json();
                    const text = result.candidates?.[0]?.content?.parts?.[0]?.text;
                    
                    if (text) {
                        return text;
                    } else {
                        throw new Error("Invalid response structure from API.");
                    }

                } catch (error) {
                    if (i === MAX_RETRIES - 1) {
                        throw error;
                    }
                }
            }
        }
        
        // Enter key triggers default compliment generation
        userInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !isGenerating) {
                handleGeneration('compliment');
            }
        });
    </script>
</body>
</html>
